name: coding_developer_driver_app
description: "A new Flutter project."

version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # Local Storage
  shared_preferences: ^2.5.4
  # secure Local Storge for tokens and secure data
  flutter_secure_storage: ^10.0.0
  # Network Api
  dio: ^5.9.2
  # Handle Errors
  dartz: ^0.10.1
  # This Package for Svg Images
  flutter_svg: ^2.2.4
  # Loading Animation
  loading_animation_widget: ^1.3.0
  # State Management
  flutter_bloc: ^9.1.1


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/svgs/
    - assets/images/
    - assets/icons/

